<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLINA ORO | Activo Refugio</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:'Montserrat',sans-serif;
text-align:center;
}

header{
padding:60px 20px 30px 20px;
}

header img{
width:140px;
margin-bottom:20px;
}

h1{
font-weight:600;
letter-spacing:4px;
margin:0;
}

.sub{
color:#caa94d;
margin-top:10px;
letter-spacing:2px;
font-size:14px;
}

.dashboard{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:30px;
padding:40px 20px;
}

.card{
background:#0a0a0a;
border:1px solid #caa94d;
border-radius:20px;
padding:30px;
width:300px;
box-shadow:0 0 25px rgba(202,169,77,0.15);
}

.card h3{
color:#caa94d;
letter-spacing:2px;
font-weight:500;
}

.price{
font-size:40px;
font-weight:700;
margin-top:15px;
}

.info{
color:#aaa;
margin-top:10px;
font-size:13px;
}

.chart-section{
margin-top:40px;
padding:20px;
}

.news{
margin-top:50px;
padding:20px;
}

.news h2{
color:#caa94d;
letter-spacing:3px;
}

footer{
margin-top:60px;
padding:20px;
color:#666;
font-size:12px;
}
</style>
</head>

<body>

<header>
<img src="logo.png" alt="MOLINA ORO Logo">
<h1>MOLINA ORO</h1>
<div class="sub">ACTIVO REFUGIO</div>
</header>

<section class="dashboard">

<div class="card">
<h3>XAU / EUR</h3>
<div class="price" id="goldPrice">€ Cargando...</div>
<div class="info">Precio spot por onza</div>
</div>

<div class="card">
<h3>MARKET CAP</h3>
<div class="price">€ 20T+</div>
<div class="info">Estimación global oro físico</div>
</div>

<div class="card">
<h3>ACTUALIZACIÓN</h3>
<div class="price" id="updateTime">--:--</div>
<div class="info">Último refresh automático</div>
</div>

</section>

<section class="chart-section">
<div class="tradingview-widget-container">
  <div id="tradingview_chart"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
  new TradingView.widget({
  "container_id": "tradingview_chart",
  "autosize": true,
  "symbol": "OANDA:XAUEUR",
  "interval": "D",
  "timezone": "Etc/UTC",
  "theme": "dark",
  "style": "1",
  "locale": "es",
  "toolbar_bg": "#000000",
  "enable_publishing": false,
  "hide_side_toolbar": false
});
  </script>
</div>
</section>

<section class="news">
<h2>NOTICIAS DEL ORO</h2>
<div id="newsContainer">Cargando noticias...</div>
</section>

<footer>
© 2026 MOLINA ORO – Activo Refugio
</footer>

<script>
async function fetchGoldPrice(){
try{
const response = await fetch("https://api.gold-api.com/price/XAU/EUR");
const data = await response.json();
document.getElementById("goldPrice").innerText = "€ " + data.price.toFixed(2);
document.getElementById("updateTime").innerText = new Date().toLocaleTimeString();
}catch(error){
document.getElementById("goldPrice").innerText = "€ No disponible";
}
}
fetchGoldPrice();
setInterval(fetchGoldPrice, 60000);

async function fetchNews(){
try{
const response = await fetch("https://api.rss2json.com/v1/api.json?rss_url=https://www.kitco.com/rss/news");
const data = await response.json();
let newsHTML = "";
data.items.slice(0,3).forEach(item=>{
newsHTML += `<p><a href="${item.link}" target="_blank" style="color:#caa94d;text-decoration:none;">${item.title}</a></p>`;
});
document.getElementById("newsContainer").innerHTML = newsHTML;
}catch{
document.getElementById("newsContainer").innerText = "No se pudieron cargar noticias.";
}
}
fetchNews();
</script>

</body>
</html>
