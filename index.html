<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLINA ORO | XAU/EUR</title>

<style>
body {
    margin: 0;
    background-color: #000000;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo img {
    width: 180px;
}

.titulo {
    text-align: center;
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 15px;
    color: #d4af37;
}
</style>

</head>

<body>

<div class="container">

    <div class="logo">
        <img src="logo.png" alt="MOLINA ORO">
    </div>

    <div class="titulo">
        XAU / EUR
    </div>

    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container">
      <div id="tradingview_chart"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
      new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": "OANDA:XAU_EUR",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "es",
        "toolbar_bg": "#000000",
        "enable_publishing": false,
        "hide_top_toolbar": true,
        "container_id": "tradingview_chart"
      });
      </script>
    </div>
    <!-- TradingView Widget END -->

</div>

</body>
</html>
