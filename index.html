<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>MOLINA ORO | Activo Refugio</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#000000;
    color:#ffffff;
    font-family:'Montserrat', sans-serif;
}

.container{
    width:1080px;
    margin:auto;
    padding:0;
    text-align:center;
}

.card{
    border:1px solid #caa84a;
    border-radius:0;
    padding:0;
    background:#000000;
}

.section-title{
    color:#caa84a;
    letter-spacing:3px;
    padding:40px 0;
    font-weight:400;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2 class="section-title">GRÁFICO HISTÓRICO XAU/EUR</h2>

<div id="tradingview_chart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
    "width": 1080,
    "height": 2000,
    "symbol": "OANDA:XAUEUR",
    "interval": "D",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "es",
    "toolbar_bg": "#000000",
    "enable_publishing": false,
    "allow_symbol_change": false,
    "container_id": "tradingview_chart"
});
</script>

</div>

</div>

</body>
</html>
