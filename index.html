<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MOLINA ORO | XAU/EUR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      margin-top: 30px;
      font-size: 28px;
      letter-spacing: 2px;
    }
    h2 {
      color: #c9a227;
      font-weight: normal;
      margin-bottom: 30px;
    }
    .footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>

  <h1>MOLINA ORO</h1>
  <h2>Mercado del Oro (XAU/EUR)</h2>

  <!-- TradingView Widget -->
  <div class="tradingview-widget-container">
    <div id="tradingview_chart"></div>
  </div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    new TradingView.widget({
      "width": "100%",
      "height": 500,
      "symbol": "OANDA:XAU_EUR",
      "interval": "D",
      "timezone": "Europe/Madrid",
      "theme": "dark",
      "style": "1",
      "locale": "es",
      "toolbar_bg": "#0d0d0d",
      "enable_publishing": false,
      "hide_side_toolbar": false,
      "container_id": "tradingview_chart"
    });
  </script>

  <div class="footer">
    MOLINA ORO | Activo Refugio
  </div>

</body>
</html>
