<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLINA ORO | XAU/EUR</title>

<style>
body {
    margin: 0;
    background-color: #000000;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
}

header {
    padding: 30px 20px;
}

.logo {
    width: 140px;
    margin-bottom: 15px;
}

.pair {
    font-size: 22px;
    letter-spacing: 3px;
    color: #d4af37;
}

.tradingview-widget-container {
    margin-top: 20px;

    margin-top: 20px;

<header>
    <img src="logo.png" alt="MOLINA ORO" class="logo">

<!-- TradingView Widget BEGIN -->

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

  new TradingView.widget({
  "width": "100%",
  "height": 600,
  "symbol": "OANDA:XAU_EUR",
  "interval": "D",
  "timezone": "Europe/Madrid",
  "theme": "dark",
  "style": "1",
  "locale": "es",
  "toolbar_bg": "#000000",
  "enable_publishing": false,
  "hide_top_toolbar": false,
  "hide_legend": false,
  "save_image": false,
  "container_id": "tradingview_chart"
});

</div>

MOLINA ORO
</div>
