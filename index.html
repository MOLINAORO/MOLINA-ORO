un <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLINA ORO </title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#000000;
    color:#ffffff;
    font-family:'Montserrat', sans-serif;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:60px 0;
    text-align:center;
}

.logo{
    width:130px;
    margin-bottom:20px;
}

h1{
    letter-spacing:6px;
    font-size:28px;
    font-weight:600;
    margin:0;
}

.subtitle{
    color:#caa84a;
    margin-top:10px;
    margin-bottom:50px;
    font-size:13px;
    letter-spacing:3px;
}

.card{
    border:1px solid #caa84a;
    border-radius:20px;
    padding:40px 20px;
    margin-bottom:50px;
    background:linear-gradient(145deg,#0a0a0a,#111111);
    box-shadow:0 0 30px rgba(202,168,74,0.15);
}

.section-title{
    color:#caa84a;
    letter-spacing:3px;
    margin-bottom:30px;
    font-weight:400;
}

.footer{
    margin-top:60px;
    font-size:12px;
    color:#777;
    letter-spacing:1px;
}

@media(max-width:768px){
    h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- LOGO -->
<img src="logo.png" class="logo" alt="Logo MOLINA ORO">

<h1>MOLINA ORO</h1>
 <div style="height: 40px;"></div>
 

<!-- PRECIO EN VIVO XAU/EUR -->

<div class="card">
<h2 class="section-title">PRECIO ORO EN VIVO (XAU/EUR)</h2>

<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
  {
  "symbol": "OANDA:XAUEUR",
  "width": "100%",
  "colorTheme": "dark",
  "isTransparent": true,
  "locale": "es"
}
  </script>
</div>

</div>

<!-- GRÁFICO PROFESIONAL -->

<div class="card">
<h2 class="section-title">PRECIO SPOT XAU/EUR</h2>

<div id="tradingview_chart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
    "width": "100%",
    "height": 600,
    "symbol": "OANDA:XAUEUR",
    "interval": "D",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "es",
    "toolbar_bg": "#000000",
    "enable_publishing": false,
    "allow_symbol_change": false,
    "container_id": "tradingview_chart"
});
</script>

</div>

<div class="footer">
MOLINA ORO 
</div>

</div>

</body>
</html>
